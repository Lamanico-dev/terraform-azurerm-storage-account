repos:

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.2.0
  hooks:
  -   id: detect-secrets
      args: ['--baseline', '.secrets.baseline']
      exclude: package.lock.json

- repo: https://github.com/bridgecrewio/checkov.git
  rev: 2.2.220
  hooks:
  - id: checkov
    verbose: true
    args: ["--skip-download","--download-external-modules", "true","-d","exampleterraform", "--quiet","--compact"]

- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.64.0
  hooks:
    - id: terraform_fmt
    - id: terraform_validate
    - id: terraform_tflint
    - id: terraform_docs
